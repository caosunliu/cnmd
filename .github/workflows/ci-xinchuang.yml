name: Xinchuang Build

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_platform:
        description: 'Target platform'
        required: true
        default: 'all'
        type: choice
        options: [all, kylin, uos, openeuler]
      build_arch:
        description: 'Target architecture'
        required: false
        default: 'all'
        type: choice
        options: [all, amd64, arm64]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===== Code Quality =====
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check C code
        run: find src/postgresql-18/src -name "*.c" -exec grep -l "cnmd\|CNMD" {} \; | head -20 || true

  # ===== Docker Builds =====
  build-docker:
    runs-on: ubuntu-latest
    needs: code-quality
    if: |
      github.event.inputs.build_platform == 'all' || 
      github.event.inputs.build_platform == matrix.platform ||
      github.event_name != 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - platform: kylin
            arch: amd64
            dockerfile: docker/Dockerfile.kylin
            platform_tag: linux/amd64
          - platform: kylin
            arch: arm64
            dockerfile: docker/Dockerfile.kylin
            platform_tag: linux/arm64
          - platform: uos
            arch: amd64
            dockerfile: docker/Dockerfile.uos
            platform_tag: linux/amd64
          - platform: openeuler
            arch: amd64
            dockerfile: docker/Dockerfile.openeuler
            platform_tag: linux/amd64
          - platform: openeuler
            arch: arm64
            dockerfile: docker/Dockerfile.openeuler
            platform_tag: linux/arm64

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform_tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform_tag }}
          push: ${{ github.event.inputs.push_images != 'false' }}
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ matrix.platform }}-${{ matrix.arch }}
            ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.platform }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}-${{ matrix.arch }}

  # ===== Cross-compile for CPU architectures =====
  build-cpu-arch:
    runs-on: ubuntu-latest
    needs: code-quality
    if: |
      github.event.inputs.build_arch == 'all' || 
      github.event_name != 'workflow_dispatch'
    strategy:
      matrix:
        cpu:
          - name: Phytium
            arch: arm64
            cross_compile: aarch64-linux-gnu-
            host: aarch64-linux-gnu
          - name: Kunpeng
            arch: arm64
            cross_compile: aarch64-linux-gnu-
            host: aarch64-linux-gnu
          - name: Hygon
            arch: amd64
            cross_compile: ''
            host: x86_64-linux-gnu

    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison perl curl \
            zlib1g-dev libicu-dev uuid-dev libssl-dev
          if [ "${{ matrix.cpu.arch }}" = "arm64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi
      - name: Build arm64 sysroot
        if: matrix.cpu.cross_compile != ''
        run: |
          set -e
          SYSROOT="$HOME/arm64-sysroot"
          cat > "$RUNNER_TEMP/arm64-toolchain.cmake" <<'EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR aarch64)
          set(CMAKE_C_COMPILER aarch64-linux-gnu-gcc)
          set(CMAKE_CXX_COMPILER aarch64-linux-gnu-g++)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          EOF
          mkdir -p "$SYSROOT/usr"
          cd "$RUNNER_TEMP"
          curl -fsSL -o zlib.tar.gz https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          tar -xzf zlib.tar.gz
          cd zlib-1.3.1
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/arm64-toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$SYSROOT/usr" \
            -DZLIB_BUILD_EXAMPLES=OFF
          cmake --build build -j $(nproc)
          cmake --install build
          cd "$RUNNER_TEMP"
          curl -fsSL -o openssl.tar.gz https://github.com/openssl/openssl/releases/download/openssl-3.2.1/openssl-3.2.1.tar.gz
          tar -xzf openssl.tar.gz
          cd openssl-3.2.1
          ./Configure linux-aarch64 \
            --prefix="$SYSROOT/usr" \
            --openssldir="$SYSROOT/usr/ssl" \
            no-shared no-tests \
            CC=aarch64-linux-gnu-gcc \
            AR=aarch64-linux-gnu-ar \
            RANLIB=aarch64-linux-gnu-ranlib
          make -j$(nproc)
          make install_sw
          echo "SYSROOT=$SYSROOT" >> "$GITHUB_ENV"
      - name: Build CNMD
        run: |
          cd src/postgresql-18
          chmod +x configure
          if [ -n "${{ matrix.cpu.cross_compile }}" ]; then
            export CPPFLAGS="-I${{ env.SYSROOT }}/usr/include"
            export LDFLAGS="-L${{ env.SYSROOT }}/usr/lib -L${{ env.SYSROOT }}/usr/lib64"
            export PKG_CONFIG_LIBDIR=${{ env.SYSROOT }}/usr/lib/pkgconfig
            export PKG_CONFIG_PATH=
            ./configure \
              --host=${{ matrix.cpu.host }} \
              --prefix=${{ github.workspace }}/build/cnmd \
              --with-ssl=openssl \
              --enable-integer-datetimes \
              --without-readline \
              --without-icu
          else
            ./configure \
              --prefix=${{ github.workspace }}/build/cnmd \
              --with-ssl=openssl \
              --enable-integer-datetimes \
              --without-readline
          fi
          make -j$(nproc)
          make install
      - uses: actions/upload-artifact@v4
        with:
          name: cnmd-${{ matrix.cpu.name }}
          path: build/cnmd/
          retention-days: 7

  # ===== Release =====
  release:
    runs-on: ubuntu-latest
    needs: [build-docker, build-cpu-arch]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v1
        with:
          name: CNMD ${{ steps.version.outputs.version }} Xinchuang
          generate_release_notes: true
          files: MANIFEST.md
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
