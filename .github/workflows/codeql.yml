name: "CodeQL"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: c-cpp

    - name: 安装依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential gcc g++ make cmake git wget curl \
          pkg-config libreadline-dev zlib1g-dev libssl-dev \
          libxml2-dev libxslt1-dev libsystemd-dev libicu-dev \
          uuid-dev flex bison python3

    - name: 下载PostgreSQL源码
      run: |
        mkdir -p src
        cd src
        git clone --depth 1 --branch master https://github.com/postgres/postgres.git postgresql-18

    - name: 构建GmSSL
      run: |
        cd src
        wget -q "https://github.com/guanzhi/GmSSL/archive/refs/tags/v3.2.0.tar.gz" -O gmssl-3.2.0.tar.gz
        tar -xzf gmssl-3.2.0.tar.gz
        cd GmSSL-3.2.0
        mkdir -p build && cd build
        cmake .. -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/build/gmssl -DCMAKE_BUILD_TYPE=Release
        make -j$(nproc)
        make install

    - name: 构建CNMD
      run: |
        cd src/postgresql-18
        ./configure \
          --prefix=${{ github.workspace }}/build/cnmd \
          --with-ssl=openssl \
          --with-includes=${{ github.workspace }}/build/gmssl/include \
          --with-libraries=${{ github.workspace }}/build/gmssl/lib \
          --enable-integer-datetimes \
          --enable-thread-safety \
          --with-libxml \
          --with-libxslt \
          --with-uuid-ossp
        make -j$(nproc)

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:c-cpp"
