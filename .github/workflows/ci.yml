name: CNMD CI/CD

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_mode:
        description: '构建模式'
        required: true
        default: 'all'
        type: choice
        options:
        - native
        - docker
        - all
      architecture:
        description: '目标架构'
        required: false
        default: 'amd64'
        type: choice
        options:
        - amd64
        - arm64

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Linux构建
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-20.04]
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置构建环境
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential gcc g++ make cmake git wget curl \
          pkg-config libreadline-dev zlib1g-dev libssl-dev \
          libxml2-dev libxslt1-dev libsystemd-dev libicu-dev \
          uuid-dev flex bison python3 rpm

    - name: 构建CNMD
      run: |
        cd src/postgresql-18
        chmod +x configure
        ./configure \
          --prefix=${{ github.workspace }}/build/cnmd \
          --with-ssl=openssl \
          --enable-integer-datetimes \
          --without-readline \
          --with-libxml \
          --with-libxslt \
          --with-uuid-ossp
        make -j$(nproc)
        make install

    - name: 打包.tar.gz
      run: tar -czf cnmd-linux-amd64.tar.gz -C build cnmd

    - name: 打包.deb
      run: |
        DEB_DIR=cnmd_1.0.0_amd64
        mkdir -p $DEB_DIR/DEBIAN
        mkdir -p $DEB_DIR/usr
        cp -r build/cnmd/* $DEB_DIR/usr/
        cat > $DEB_DIR/DEBIAN/control << EOF
        Package: cnmd
        Version: 1.0.0
        Section: database
        Priority: optional
        Architecture: amd64
        Depends: libreadline8, zlib1g, libssl3, libxml2, libxslt1.1, libicu70, uuid-runtime
        Maintainer: CNMD Team <cnmd@example.com>
        Description: CNMD Database
         CNMD is a domestic database based on PostgreSQL.
        EOF
        dpkg-deb --build $DEB_DIR cnmd_1.0.0_amd64.deb

    - name: 打包.rpm
      run: |
        mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
        cat > ~/rpmbuild/SPECS/cnmd.spec << 'EOF'
        Name: cnmd
        Version: 1.0.0
        Release: 1
        Summary: CNMD Database
        License: PostgreSQL
        Group: Applications/Databases
        BuildRoot: %{_tmppath}/%{name}-buildroot
        Requires: readline zlib openssl libxml2 libxslt libicu util-linux

        %description
        CNMD is a domestic database based on PostgreSQL.

        %install
        cp -r %{_sourcedir}/cnmd %{buildroot}/usr/local/

        %files
        /usr/local/cnmd/*
        EOF
        cp -r build/cnmd ~/rpmbuild/SOURCES/
        rpmbuild -bb ~/rpmbuild/SPECS/cnmd.spec

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: cnmd-linux-${{ matrix.os }}
        path: |
          cnmd-linux-amd64.tar.gz
          cnmd_1.0.0_amd64.deb
          cnmd-1.0.0-1.x86_64.rpm
        retention-days: 7

  # macOS构建
  build-macos:
    strategy:
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-13
            arch: x86_64
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装依赖
      run: |
        brew install openssl@3 readline zlib libxml2 libxslt icu4c cmake wget

    - name: 构建CNMD
      run: |
        cd src/postgresql-18
        chmod +x configure
        export PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix icu4c)/lib/pkgconfig:$(brew --prefix libxslt)/lib/pkgconfig"
        export LDFLAGS="-L$(brew --prefix openssl@3)/lib -L$(brew --prefix readline)/lib -L$(brew --prefix zlib)/lib -L$(brew --prefix icu4c)/lib"
        export CPPFLAGS="-I$(brew --prefix openssl@3)/include -I$(brew --prefix readline)/include -I$(brew --prefix zlib)/include -I$(brew --prefix icu4c)/include"
        ./configure \
          --prefix=${{ github.workspace }}/build/cnmd \
          --with-ssl=openssl \
          --with-includes=$(brew --prefix openssl@3)/include \
          --with-libraries=$(brew --prefix openssl@3)/lib \
          --enable-integer-datetimes \
          --without-readline \
          --with-libxslt
        make -j$(sysctl -n hw.ncpu)
        make install

    - name: 打包.tar.gz
      run: tar -czf cnmd-macos-${{ matrix.arch }}.tar.gz -C build cnmd

    - name: 打包.pkg
      run: |
        pkgbuild --root build/cnmd \
          --identifier com.cnmd.database \
          --version 1.0.0 \
          --install-location /usr/local \
          cnmd-1.0.0-${{ matrix.arch }}.pkg

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: cnmd-macos-${{ matrix.arch }}
        path: |
          cnmd-macos-${{ matrix.arch }}.tar.gz
          cnmd-1.0.0-${{ matrix.arch }}.pkg
        retention-days: 7

  # Docker构建
  build-docker:
    runs-on: ubuntu-latest
    needs: build-linux
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 登录Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: 登录GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 提取元数据
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ env.IMAGE_NAME }}
          ghcr.io/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=sha

    - name: 构建并推送Docker镜像
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/Dockerfile.multiarch
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # 安全扫描
  security-scan:
    runs-on: ubuntu-latest
    needs: build-linux
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 运行安全扫描
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vulnerability-type: 'os,library'

  # 发布
  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-docker, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 下载构建产物
      uses: actions/download-artifact@v4
      with:
        path: artifacts/

    - name: 创建发布包
      run: |
        # Linux 包
        cp artifacts/cnmd-linux-ubuntu-22.04/cnmd-linux-amd64.tar.gz .
        cp artifacts/cnmd-linux-ubuntu-22.04/cnmd_1.0.0_amd64.deb .
        cp artifacts/cnmd-linux-ubuntu-22.04/cnmd-1.0.0-1.x86_64.rpm .
        # macOS 包
        cp artifacts/cnmd-macos-arm64/cnmd-macos-arm64.tar.gz .
        cp artifacts/cnmd-macos-arm64/cnmd-1.0.0-arm64.pkg .
        cp artifacts/cnmd-macos-x86_64/cnmd-macos-x86_64.tar.gz .
        cp artifacts/cnmd-macos-x86_64/cnmd-1.0.0-x86_64.pkg .
        # 源码包
        tar -czf cnmd-source.tar.gz --exclude='.git' .

    - name: 创建Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          cnmd-linux-amd64.tar.gz
          cnmd_1.0.0_amd64.deb
          cnmd-1.0.0-1.x86_64.rpm
          cnmd-macos-arm64.tar.gz
          cnmd-1.0.0-arm64.pkg
          cnmd-macos-x86_64.tar.gz
          cnmd-1.0.0-x86_64.pkg
          cnmd-source.tar.gz
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
