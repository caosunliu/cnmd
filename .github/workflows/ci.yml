name: CI

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  VERSION: '1.0.0'

jobs:
  # ===== Linux =====
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
          - os: ubuntu-20.04
            arch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-deps
        with:
          os: linux
      - uses: ./.github/actions/build-cnmd
        with:
          os: linux
          prefix: ${{ github.workspace }}/build/cnmd
      - uses: ./.github/actions/package
        with:
          os: linux
          arch: ${{ matrix.arch }}
          version: ${{ env.VERSION }}

  # ===== macOS =====
  build-macos:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-13
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-deps
        with:
          os: macos
      - uses: ./.github/actions/build-cnmd
        with:
          os: macos
          prefix: ${{ github.workspace }}/build/cnmd
      - uses: ./.github/actions/package
        with:
          os: macos
          arch: ${{ matrix.arch }}
          version: ${{ env.VERSION }}

  # ===== Windows =====
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-deps
        with:
          os: windows
      - uses: ./.github/actions/build-cnmd
        with:
          os: windows
          prefix: ${{ github.workspace }}\build\cnmd
          jobs: 4
      - uses: ./.github/actions/package
        with:
          os: windows
          arch: x64
          version: ${{ env.VERSION }}

  # ===== Docker =====
  build-docker:
    runs-on: ubuntu-latest
    needs: [build-linux]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.multiarch
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===== Release =====
  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows, build-docker]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Create source archive
        run: tar -czf cnmd-source.tar.gz --exclude='.git' .
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: CNMD ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/cnmd-linux-amd64/cnmd-linux-amd64.tar.gz
            artifacts/cnmd-linux-amd64/cnmd_1.0.0_amd64.deb
            artifacts/cnmd-linux-amd64/cnmd-1.0.0-1.x86_64.rpm
            artifacts/cnmd-macos-arm64/cnmd-macos-arm64.tar.gz
            artifacts/cnmd-macos-arm64/cnmd-1.0.0-arm64.pkg
            artifacts/cnmd-macos-x86_64/cnmd-macos-x86_64.tar.gz
            artifacts/cnmd-macos-x86_64/cnmd-1.0.0-x86_64.pkg
            artifacts/cnmd-windows-x64/cnmd-*-windows-x64.zip
            artifacts/cnmd-windows-x64/cnmd-*-windows-x64.exe
            artifacts/cnmd-windows-x64/cnmd-*-windows-x64.msi
            cnmd-source.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
