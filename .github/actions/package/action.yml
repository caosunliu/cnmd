name: 'Package CNMD'
description: 'Create distribution packages for CNMD'

inputs:
  os:
    description: 'Target OS (linux, macos, windows)'
    required: true
  arch:
    description: 'Target architecture (amd64, arm64, x64)'
    required: false
    default: 'amd64'
  version:
    description: 'Package version'
    required: true

runs:
  using: 'composite'
  steps:
    # ===== Linux =====
    - name: Package .tar.gz (Linux)
      if: inputs.os == 'linux'
      shell: bash
      run: tar -czf cnmd-linux-${{ inputs.arch }}.tar.gz -C build cnmd

    - name: Package .deb
      if: inputs.os == 'linux'
      shell: bash
      run: |
        DEB_DIR=cnmd_${{ inputs.version }}_amd64
        mkdir -p $DEB_DIR/DEBIAN
        mkdir -p $DEB_DIR/usr
        cp -r build/cnmd/* $DEB_DIR/usr/
        cat > $DEB_DIR/DEBIAN/control << EOF
        Package: cnmd
        Version: ${{ inputs.version }}
        Section: database
        Priority: optional
        Architecture: amd64
        Depends: libreadline8, zlib1g, libssl3, libxml2, libxslt1.1, libicu70, uuid-runtime
        Maintainer: CNMD Team <cnmd@example.com>
        Description: CNMD Database
         CNMD is a domestic database based on PostgreSQL.
        EOF
        dpkg-deb --build $DEB_DIR cnmd_${{ inputs.version }}_amd64.deb

    - name: Package .rpm
      if: inputs.os == 'linux'
      shell: bash
      run: |
        mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
        cat > ~/rpmbuild/SPECS/cnmd.spec << 'EOF'
        Name: cnmd
        Version: ${{ inputs.version }}
        Release: 1
        Summary: CNMD Database
        License: PostgreSQL
        Group: Applications/Databases
        BuildRoot: %{_tmppath}/%{name}-buildroot
        Requires: readline zlib openssl libxml2 libxslt libicu util-linux

        %description
        CNMD is a domestic database based on PostgreSQL.

        %install
        mkdir -p %{buildroot}/usr/local
        cp -r %{_sourcedir}/cnmd %{buildroot}/usr/local/

        %files
        /usr/local/cnmd/*
        EOF
        cp -r build/cnmd ~/rpmbuild/SOURCES/
        rpmbuild -bb ~/rpmbuild/SPECS/cnmd.spec

    # ===== macOS =====
    - name: Package .tar.gz (macOS)
      if: inputs.os == 'macos'
      shell: bash
      run: tar -czf cnmd-macos-${{ inputs.arch }}.tar.gz -C build cnmd

    - name: Package .pkg
      if: inputs.os == 'macos'
      shell: bash
      run: |
        pkgbuild --root build/cnmd \
          --identifier com.cnmd.database \
          --version ${{ inputs.version }} \
          --install-location /usr/local \
          cnmd-${{ inputs.version }}-${{ inputs.arch }}.pkg

    # ===== Windows =====
    - name: Package .zip (Windows)
      if: inputs.os == 'windows'
      shell: pwsh
      run: Compress-Archive -Path build\cnmd -DestinationPath cnmd-${{ inputs.version }}-windows-${{ inputs.arch }}-portable.zip

    - name: Package .exe (NSIS)
      if: inputs.os == 'windows'
      shell: pwsh
      run: |
        $nsis = "$env:ProgramFiles\NSIS\makensis.exe"
        if (-not (Test-Path $nsis)) { $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
        if (Test-Path $nsis) {
          & $nsis /DPRODUCT_VERSION=${{ inputs.version }} installer\windows\cnmd.nsi
        } else {
          Write-Warning "NSIS not found, skipping .exe"
        }

    - name: Package .msi (WiX)
      if: inputs.os == 'windows'
      shell: pwsh
      run: |
        $wixDir = "$env:ProgramFiles\WiX Toolset v3.11\bin"
        if (-not (Test-Path $wixDir)) { $wixDir = "${env:ProgramFiles(x86)}\WiX Toolset v3.11\bin" }
        if (Test-Path $wixDir) {
          $candle = Join-Path $wixDir "candle.exe"
          $light = Join-Path $wixDir "light.exe"
          & $candle -nologo -arch x64 -out build\windows\cnmd.wixobj installer\windows\cnmd.wxs
          & $light -nologo -out cnmd-${{ inputs.version }}-windows-${{ inputs.arch }}.msi build\windows\cnmd.wixobj
        } else {
          Write-Warning "WiX not found, skipping .msi"
        }

    # ===== Upload =====
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cnmd-${{ inputs.os }}-${{ inputs.arch }}
        path: |
          cnmd-*-linux-*.tar.gz
          cnmd_*_*.deb
          cnmd-*.*.rpm
          cnmd-*-macos-*.tar.gz
          cnmd-*.pkg
          cnmd-*-windows-*.zip
          cnmd-*-windows-*.exe
          cnmd-*-windows-*.msi
        retention-days: 7
