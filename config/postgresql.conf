# ============================================
# CNMD 数据库配置文件
# 基于PostgreSQL 18，满足信创要求
# ============================================

# ---------------------------------------------
# 连接设置
# ---------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 100
superuser_reserved_connections = 3

# ---------------------------------------------
# 安全配置
# ---------------------------------------------
# 认证方式
password_encryption = sm3

# SSL配置
ssl = on
ssl_cert_file = '/etc/cnmd/server.crt'
ssl_key_file = '/etc/cnmd/server.key'
ssl_ciphers = 'SM4-GCM-SM3'

# 审计日志
audit_log = on
audit_log_file = '/var/log/cnmd/audit.log'
audit_log_statement = 'all'

# ---------------------------------------------
# MySQL兼容模式
# ---------------------------------------------
cnmd.compatibility_mode = 'mysql'

# ---------------------------------------------
# 国密算法配置
# ---------------------------------------------
# SM2配置
sm2_curve = 'sm2p256v1'

# SM4配置
sm4_mode = 'cbc'

# ---------------------------------------------
# 内存配置
# ---------------------------------------------
shared_buffers = '256MB'
effective_cache_size = '1GB'
work_mem = '16MB'
maintenance_work_mem = '64MB'

# ---------------------------------------------
# 日志配置
# ---------------------------------------------
logging_collector = on
log_directory = '/var/log/cnmd'
log_filename = 'cnmd-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 1000

# ---------------------------------------------
# 性能配置
# ---------------------------------------------
wal_buffers = '16MB'
checkpoint_completion_target = 0.9
random_page_cost = 1.1
effective_io_concurrency = 200

# ---------------------------------------------
# 复制配置
# ---------------------------------------------
max_wal_senders = 10
wal_level = replica
hot_standby = on

# ---------------------------------------------
# 自动清理配置
# ---------------------------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
